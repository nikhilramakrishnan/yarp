---
name: "Run Yarp locally with shell"
command: "YARP_SHELL_PATH={{shell}} cargo run"
description: "Runs yarp with the particular shell so devs don't need to change their login shell to test a different shell locally"
arguments:
  - name: shell
    description: path of shell to use
author: Yarp Team
shells: []
