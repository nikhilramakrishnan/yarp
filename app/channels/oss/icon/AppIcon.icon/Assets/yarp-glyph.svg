<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <!--
    Yarp logo — V4 canon mark.
    Soft-mood portrait, mono navy on cream, rounded-square frame.
    Derived from the design handoff at yarp/project/{Yarp Logo.html, portrait.jsx, medallion.jsx, app.jsx}.
    Colors:  cream #F2EDE4  ·  navy #1F2A37
  -->

  <!-- Rounded-square cream background -->
  <rect x="2" y="2" width="196" height="196" rx="40" fill="#F2EDE4" />
  <!-- Navy hairline ring -->
  <rect x="2" y="2" width="196" height="196" rx="40" fill="none" stroke="#1F2A37" stroke-width="2" />

  <!-- Portrait, transformed to match medallion rounded-square offset -->
  <g transform="translate(0,4) scale(0.86) translate(16,10)">
    <!-- Hair / chops / head mass (navy) -->
    <path
      d="M 100 28 C 78 28, 60 38, 54 56 C 50 70, 50 86, 52 100 C 52 116, 56 130, 62 142 C 66 150, 72 156, 78 158 L 78 150 C 76 140, 76 130, 78 120 C 74 110, 72 96, 74 84 C 78 76, 86 72, 100 72 C 114 72, 122 76, 126 84 C 128 96, 126 110, 122 120 C 124 130, 124 140, 122 150 L 122 158 C 128 156, 134 150, 138 142 C 144 130, 148 116, 148 100 C 150 86, 150 70, 146 56 C 140 38, 122 28, 100 28 Z"
      fill="#1F2A37" />

    <!-- Face (cream inset) -->
    <path
      d="M 100 64 C 86 64, 78 70, 76 82 C 74 94, 74 108, 76 120 C 78 134, 84 146, 92 152 C 96 156, 100 156, 100 156 C 100 156, 104 156, 108 152 C 116 146, 122 134, 124 120 C 126 108, 126 94, 124 82 C 122 70, 114 64, 100 64 Z"
      fill="#F2EDE4" />

    <!-- Eyes — soft mood: dots -->
    <circle cx="86" cy="100" r="2.4" fill="#1F2A37" />
    <circle cx="114" cy="100" r="2.4" fill="#1F2A37" />

    <!-- Nose hint -->
    <path d="M 99 114 L 99 126 L 102 128" fill="none" stroke="#1F2A37" stroke-width="1.4"
      stroke-linecap="square" stroke-linejoin="miter" opacity="0.85" />

    <!-- Stiff mouth -->
    <rect x="92" y="137" width="16" height="2" fill="#1F2A37" />

    <!-- Plaster (navy, mono — V4 has no cyan accent) -->
    <g transform="rotate(-10 111 74.5)">
      <rect x="102" y="70" width="18" height="9" rx="1" fill="#1F2A37" />
    </g>
  </g>
</svg>
